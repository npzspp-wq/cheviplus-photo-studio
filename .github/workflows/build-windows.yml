name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Static and unit checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: Generate brand assets
        run: python tools/build_brand_assets.py
      - name: Run compile and stability checks
        run: |
          python -m compileall app.py launcher.py cheviplus_stability_patch.py cheviplus_product_cutout.py cheviplus_backdrop_quality.py cheviplus_ai_quality.py cheviplus_workstation_stats.py cheviplus_license.py tools/build_brand_assets.py
          python tools/audit_static.py
          python -m unittest discover -s tests -p "test_*.py"

  build:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: Generate brand assets
        run: python tools/build_brand_assets.py
      - name: Download offline AI models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx" `
            -OutFile "models/u2netp.onnx"
          $env:U2NET_HOME = (Resolve-Path "models").Path
          python -c "from rembg import new_session; new_session('birefnet-general-lite')"
          Get-ChildItem models
      - name: Build autonomous Windows program
        run: pyinstaller --noconfirm --clean CheviplusPhotoStudio.spec
      - name: Add folders, desktop shortcut helper and instruction
        shell: pwsh
        run: |
          $appDir = "dist/Cheviplus Photo Studio"
          New-Item -ItemType Directory -Force -Path "$appDir/input" | Out-Null
          New-Item -ItemType Directory -Force -Path "$appDir/output" | Out-Null
          @'
          @echo off
          setlocal
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$appDir=[System.IO.Path]::GetFullPath('%~dp0'); $exe=Join-Path $appDir 'Cheviplus Photo Studio.exe'; if (-not (Test-Path -LiteralPath $exe)) { Write-Host 'Не найден файл программы:' $exe; exit 2 }; $desktop=[Environment]::GetFolderPath('Desktop'); $shortcut=Join-Path $desktop 'Cheviplus Photo Studio.lnk'; $ws=New-Object -ComObject WScript.Shell; $s=$ws.CreateShortcut($shortcut); $s.TargetPath=$exe; $s.WorkingDirectory=$appDir.TrimEnd([char]92); $s.IconLocation=$exe+',0'; $s.Description='Cheviplus Photo Studio'; $s.Save()"
          if errorlevel 1 (
            echo Ошибка создания ярлыка. Убедитесь, что файл находится внутри папки Cheviplus Photo Studio.
            pause
            exit /b 1
          )
          echo Ярлык Cheviplus Photo Studio создан правильно.
          pause
          '@ | Set-Content -Encoding Default "$appDir/Создать ярлык на рабочем столе.cmd"
          "Запустите Cheviplus Photo Studio.exe. Для ярлыка один раз запустите 'Создать ярлык на рабочем столе.cmd' непосредственно из папки программы. Старый неправильный ярлык перед этим удалите." |
            Set-Content -Encoding UTF8 "$appDir/ИНСТРУКЦИЯ.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Cheviplus-Photo-Studio-Windows
          path: dist/Cheviplus Photo Studio/
          retention-days: 30
