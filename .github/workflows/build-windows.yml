name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Static and unit checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run compile and stability checks
        run: |
          python -m compileall app.py launcher.py cheviplus_stability_patch.py cheviplus_fast_modes.py
          python tools/audit_static.py
          python -m unittest discover -s tests -p "test_*.py"

  build:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Download offline AI model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx" `
            -OutFile "models/u2netp.onnx"

      - name: Build autonomous Windows program
        run: pyinstaller --noconfirm --clean CheviplusPhotoStudio.spec

      - name: Add folders and instruction
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/Cheviplus Photo Studio/input" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/Cheviplus Photo Studio/output" | Out-Null
          "Запустите Cheviplus Photo Studio.exe. Python и интернет не требуются." |
            Set-Content -Encoding UTF8 "dist/Cheviplus Photo Studio/ИНСТРУКЦИЯ.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Cheviplus-Photo-Studio-Windows
          path: dist/Cheviplus Photo Studio/
          retention-days: 30
